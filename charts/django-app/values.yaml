image:
  repository: ""            # Injected from Terraform
  tag: ""                   # Injected from Terraform
  pullPolicy: IfNotPresent

secretKey: ""               # Injected from Terraform
debug: true                 # Injected from Terraform
allowedHosts: "localhost"   # Injected from Terraform

replicaCount: 1

resources:
  limits:
    cpu: "1"
    memory: "2Gi"
  requests:
    cpu: "1"
    memory: "1Gi"

service:
  type: LoadBalancer
  port: 80

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

strategy:
  updateType: RollingUpdate
  maxSurge: 50%
  maxUnavailable: 50%

env:
  - name: POSTGRES_DB
    value: postgres
  - name: POSTGRES_USER
    value: postgres
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-postgresql
        key: postgres-password
  - name: DB_HOST
    value: postgres-postgresql.django.svc.cluster.local
  - name: DB_PORT
    value: "5432"
